#
# The functions against the mock Drex API (test/mock/drex_mock.py): in Python alone, then both variants in Postgres
# 17 with plpython3u and pgsql-http (docker/Dockerfile), where the mock runs inside the container.
#
name: Mock Contract Tests
on:
  # A pull request runs on its pull_request event alone, not again for the push
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-contract-tests:
    name: Python and Postgres against the mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --quiet -e . pytest jsonschema 'psycopg[binary]'

      - name: Check the mock
        # jsonschema validates every response against Drex's schemas in test/mock/openapi.json
        run: python -m unittest discover -s test/mock

      - name: Build and start the test Postgres
        run: |
          docker build -f docker/Dockerfile -t drex-postgres-test .
          docker run -d --name drex-pg -p 55432:5432 -p 58787:8787 drex-postgres-test
          for _ in $(seq 60); do docker exec drex-pg pg_isready -q -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker exec drex-pg pg_isready -h 127.0.0.1 -U postgres

      - name: Run the tests
        env:
          DREX_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:55432/postgres
          DREX_TEST_MOCK: http://127.0.0.1:58787
        run: python -m pytest -v -rs

      - name: Postgres log
        if: failure()
        run: docker logs drex-pg
